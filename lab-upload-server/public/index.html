<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Upload file</title>
</head>
<body>
  <h1>Upload file to server</h1>

  <form
    action="/upload"
    method="post"
    enctype="multipart/form-data"
  >
    <input type="file" name="file" required />
    <button type="submit">Upload</button>
  </form>
</body>
</html>
